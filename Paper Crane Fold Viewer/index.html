<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Crane Fold Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f8f7f3;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        min-height: 100%;
        display: grid;
        place-items: start center;
        padding-top: 14px;
      }

      .hint {
        margin-top: 8px;
        color: #6d675b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="sketch-root"></div>
      <p class="hint">Draw on the paper square; the crane preview on the bottom-right updates live.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <script src="./sketch.js"></script>
  </body>
</html>
