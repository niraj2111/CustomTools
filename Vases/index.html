<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Vases - p5.js Sketch</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dialkit@2.0.2/dist/vanilla/styles.css">
    <style>
        :root {
            --panel-width: 360px;
        }
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            display: grid;
            grid-template-columns: var(--panel-width) 1fr;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            color: #eee;
        }
        aside {
            background: #1a1a1a;
            border-right: 1px solid #333;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d0d0d;
            overflow: auto;
            position: relative;
        }
        #wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 100%;
            min-height: 100%;
        }
        canvas {
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            background: white !important;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .saxi-panel {
            display: grid;
            gap: 9px;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #202020;
        }
        .saxi-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-pill {
            color: #a5a5a5;
            font-size: 11px;
            line-height: 1.4;
        }
        #saxiConnectionBadge {
            color: #d97777;
            font-size: 10px;
            font-weight: 500;
        }
        #saxiConnectionBadge[data-connected="true"] {
            color: #7fca8c;
        }
        button {
            background: #333;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        button:hover {
            background: #444;
            border-color: #555;
        }
        button:active {
            transform: translateY(1px);
        }
        .dialkit-slider-wrapper.vase-lock-control {
            padding-right: 31px;
            box-sizing: border-box;
        }
        .dialkit-slider-wrapper.vase-lock-control > .dialkit-slider {
            width: calc(100% - 31px);
        }
        button.vase-inline-lock {
            position: absolute;
            top: 4px;
            right: 0;
            z-index: 1;
            display: grid;
            place-items: center;
            width: 25px;
            height: 25px;
            padding: 0;
            color: #8d8d8d;
            background: #292929;
            border: 1px solid #3a3a3a;
            border-radius: 5px;
        }
        button.vase-inline-lock:hover {
            color: #e6e6e6;
            background: #363636;
            border-color: #4a4a4a;
        }
        button.vase-inline-lock[aria-pressed="true"] {
            color: #111;
            background: #f0f0f0;
            border-color: #f0f0f0;
        }
        button.vase-inline-lock:focus-visible {
            outline: 2px solid #f0f0f0;
            outline-offset: 1px;
        }
        button.vase-inline-lock:active {
            transform: none;
        }
        button.vase-inline-lock svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .hint {
            font-size: 12px;
            color: #888;
            margin-top: auto;
            padding: 10px 0;
            border-top: 1px solid #333;
        }
        code {
            background: #222;
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <aside>
        <div id="pane"></div>
        <div class="btn-group">
            <button type="button" id="randomBtn">New Random Vase</button>
            <button type="button" id="svgBtn">Export SVG</button>
        </div>
        <div class="saxi-panel" aria-label="SAXI plotter connection">
            <div class="saxi-panel-header">
                <span>Send to plotter</span>
                <span id="saxiConnectionBadge" data-connected="false">socket: disconnected</span>
            </div>
            <div class="status-pill" id="saxiStatus" aria-live="polite">Stream module ready</div>
            <button type="button" id="saxiStreamBtn">Stream Vase + Branches</button>
        </div>
        <div class="hint">
            <strong>Controls:</strong><br>
            - Use the sliders to adjust the vase shape.<br>
            - Multi-line rendering creates the depth effect.<br>
            - Exported SVG is ready for AxiDraw / Plotters.<br>
            - <code>R</code>: New Seed | <code>S</code>: Save SVG
        </div>
    </aside>
    <main id="main">
        <div id="wrap"></div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dialkit@2.0.2/dist/vanilla/browser.global.js"></script>
    <script src="sketch.js?v=20260928-inline-locks"></script>
</body>
</html>
