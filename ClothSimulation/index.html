<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Masked Cloth Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tweakpane@3.1.10/dist/tweakpane.min.css"
    />
    <style>
      :root {
        --panel: 360px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        grid-template-columns: var(--panel) 1fr;
        height: 100vh;
        background: #0f1218;
        color: #edf1f7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      aside {
        background: #161a23;
        border-right: 1px solid #252b37;
        padding: 12px;
        overflow: auto;
      }

      main {
        display: grid;
        min-width: 0;
      }

      #wrap {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: auto;
        touch-action: none;
      }

      canvas {
        display: block;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      }

      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .btn {
        display: inline-block;
        background: #232938;
        border: 1px solid #31384a;
        color: #edf1f7;
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .hint {
        font-size: 12px;
        line-height: 1.45;
        color: #bec7d7;
        margin-top: 10px;
      }

      code {
        color: #ffffff;
      }

      ul {
        padding-left: 18px;
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <aside>
      <div id="pane"></div>

      <div class="row">
        <button id="randomBtn" class="btn">Random Seed</button>
        <button id="regenBtn" class="btn">Rebuild Cloth</button>
        <button id="pngBtn" class="btn">Export PNG</button>
        <button id="svgBtn" class="btn">Export SVG</button>
      </div>

      <div class="hint">
        Notes:
        <ul>
          <li>Drag to pull the cloth. Hold <code>C</code> or switch to tear mode to cut it.</li>
          <li>The mesh mask decides where points exist; the tear mask pre-cuts the cloth on rebuild.</li>
          <li>Voronoi masks reuse cached seed layouts and offscreen buffers for faster iteration.</li>
          <li>Use <code>R</code> to rebuild and <code>S</code> to export SVG.</li>
        </ul>
      </div>
    </aside>

    <main>
      <div id="wrap"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.10/dist/tweakpane.min.js"></script>
    <script src="../shared/export.js"></script>
    <script src="./sketch.js"></script>
  </body>
</html>
