<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stroke Font Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: drafting desk — glyph sheet on the left, proof sheet on the right, one quiet toolbar. Guides in non-photo blue, edits in ultramarine pencil. */
:root{
  --paper:#eceee9; --panel:#f9faf7; --ink:#16181a; --muted:#6a7067; --rule:#dce0d8; --hover:#e5e8e2;
  --guide:#8ccbe8; --accent:#2b44d3; --accent-soft:rgba(43,68,211,.11); --shadow:rgba(20,24,30,.14);
  --f-ui:"Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1113; --panel:#16191b; --ink:#e7eae4; --muted:#899087; --rule:#272b2e; --hover:#1e2225;
  --guide:#24546d; --accent:#8496ff; --accent-soft:rgba(132,150,255,.15); --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1113; --panel:#16191b; --ink:#e7eae4; --muted:#899087; --rule:#272b2e; --hover:#1e2225;
  --guide:#24546d; --accent:#8496ff; --accent-soft:rgba(132,150,255,.15); --shadow:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:13px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--f-mono)}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;height:54px;min-width:0}
.mark{display:flex;flex-direction:column;gap:1px;min-width:0}
.kicker{font:500 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-left:6px}
.name{font:600 16px var(--f-ui);border:0;background:transparent;color:var(--ink);padding:2px 6px;border-radius:6px;width:min(280px,46vw)}
.name:hover{background:var(--hover)}
.grow{flex:1}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:3px 12px 3px 4px;cursor:pointer;height:34px}
.chip:hover{border-color:var(--muted)}
.chip canvas{width:58px;height:26px;border-radius:999px;background:var(--paper)}
.chip span{font-size:12px;color:var(--muted)} .chip b{font-weight:500;color:var(--ink)}
.ic{width:34px;height:34px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.ic:hover{background:var(--hover);color:var(--ink)}
.ic svg{width:18px;height:18px}

/* split */
main{display:grid;grid-template-columns:var(--lw,56%) 12px minmax(0,1fr);min-height:0}
.pane{background:var(--panel);border:1px solid var(--rule);border-radius:12px;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;position:relative}
#divider{cursor:col-resize;position:relative;touch-action:none}
#divider::after{content:"";position:absolute;left:5px;top:44%;height:12%;width:2px;border-radius:2px;background:var(--rule)}
#divider:hover::after{background:var(--accent)}

/* glyph sheet */
#gridView{overflow:auto;padding:4px 16px 28px;flex:1;min-height:0}
.sh{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px}
.sh b{font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.sh span{color:var(--muted);font:10px var(--f-mono);font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.cell{position:relative;aspect-ratio:4/5;border:1px solid var(--rule);border-radius:7px;background:var(--panel);overflow:hidden;max-width:100%}
.cell canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.cell:hover{border-color:var(--muted)}
.cell.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lab{position:absolute;left:6px;top:4px;font:10px var(--f-mono);color:var(--muted);pointer-events:none}
.open{position:absolute;right:2px;top:2px;width:22px;height:22px;border:0;background:transparent;color:var(--muted);border-radius:5px;opacity:0;cursor:pointer;display:grid;place-items:center;padding:0}
.open svg{width:12px;height:12px}
.cell:hover .open,.open:focus-visible{opacity:1}
.open:hover{background:var(--hover);color:var(--ink)}
.dots{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:2px}
.dot{width:14px;height:14px;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;border:1px solid var(--muted)}
.dot.on::before{background:var(--ink);border-color:var(--ink)}
.dot.add{opacity:0;color:var(--muted);font:11px var(--f-mono);line-height:1}
.dot.add::before{display:none}
.cell:hover .dot.add{opacity:1}
.cell.add{display:grid;place-items:center;border-style:dashed;cursor:pointer;color:var(--muted);text-align:center}
.cell.add:hover{color:var(--ink);border-color:var(--muted)}
.cell.add .plus{font:300 26px var(--f-ui);line-height:1}
.cell.add small{display:block;font:10px var(--f-mono);margin-top:4px}
.cell.add input{width:80%;font:16px var(--f-mono);text-align:center;border:0;border-bottom:1px solid var(--accent);background:transparent;color:var(--ink);outline:none}

/* editor */
#editView{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.ehead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--rule);min-width:0;flex-wrap:wrap}
.eglyph{display:flex;align-items:baseline;gap:8px;min-width:0}
.eglyph #eChar{font:600 22px var(--f-ui)}
.eglyph #eCode{font:10px var(--f-mono);color:var(--muted)}
.vars{display:flex;align-items:center;gap:4px;margin-left:10px}
.vars .lbl{font:10px var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
.vp{min-width:26px;height:26px;border-radius:13px;border:1px solid var(--rule);background:transparent;cursor:pointer;font:500 11px var(--f-mono);padding:0 8px}
.vp:hover{border-color:var(--muted)}
.vp.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.vp.add{border-style:dashed;color:var(--muted)}
.ebody{flex:1;display:flex;min-height:0}
.strip{width:78px;border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.strip .cap{font:9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 0 6px;text-align:center}
#eList{flex:1;overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.si{position:relative;border:1px solid var(--rule);border-radius:7px;background:var(--panel);cursor:grab;touch-action:none;user-select:none;transition:transform .15s}
.si canvas{display:block;width:100%;aspect-ratio:1;max-width:100%}
.si .num{position:absolute;left:4px;top:2px;font:500 10px var(--f-mono);color:var(--muted)}
.si.on{border-color:var(--accent)} .si.on .num{color:var(--accent)}
.si.lift{transition:none;z-index:2;box-shadow:0 6px 18px var(--shadow);cursor:grabbing}
.si:hover{border-color:var(--muted)}
.empty-strip{font:10px var(--f-mono);color:var(--muted);text-align:center;padding:8px 2px;line-height:1.5}
.play{margin:8px;height:30px;border-radius:7px;border:1px solid var(--rule);background:transparent;cursor:pointer;font:500 11px var(--f-mono);display:flex;align-items:center;justify-content:center;gap:6px}
.play:hover{border-color:var(--muted)}
.stage{flex:1;position:relative;min-width:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.efoot{display:flex;align-items:center;gap:12px;padding:8px 10px;border-top:1px solid var(--rule);flex-wrap:wrap}
.hint{color:var(--muted);font-size:11.5px;flex:1;min-width:0}
.hint kbd{font:10px var(--f-mono);border:1px solid var(--rule);border-radius:4px;padding:0 4px;color:var(--ink)}

/* proof sheet */
#pText{border:0;border-bottom:1px solid var(--rule);font:12.5px/1.55 var(--f-mono);resize:none;padding:12px 16px;background:transparent;color:var(--muted);outline:none;height:108px}
#pText:focus{color:var(--ink)}
#pWrap{flex:1;overflow:auto;position:relative;min-height:0}
#preview{display:block;width:100%}
.pfoot{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--rule);align-items:center}

/* scrub labels & toggles */
.scrub{--f:50%;display:inline-flex;gap:8px;align-items:baseline;padding:5px 10px;border-radius:7px;cursor:ew-resize;user-select:none;touch-action:none;font-size:12px;
  background:linear-gradient(90deg,var(--accent-soft) var(--f),transparent var(--f)),var(--hover)}
.scrub .k{color:var(--muted)}
.scrub .v{font:500 11px var(--f-mono);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.scrub.dim{opacity:.4}
.tog{display:inline-flex;gap:6px;align-items:baseline;padding:5px 10px;border-radius:7px;border:0;background:transparent;cursor:pointer;font-size:12px;color:var(--muted)}
.tog b{font:500 11px var(--f-mono);color:var(--ink)}
.tog:hover{background:var(--hover)}

/* popovers */
.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:0 14px 40px var(--shadow);padding:12px;width:300px;max-width:calc(100vw - 32px)}
#bSwatch{width:100%;height:84px;display:block;border-radius:8px;background:var(--paper)}
.seg{display:flex;gap:2px;background:var(--hover);border-radius:8px;padding:2px;margin:10px 0}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 4px;cursor:pointer;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center}
.bgrid .scrub{justify-content:space-between}
.dialrow{display:flex;align-items:center;gap:10px;grid-column:span 2;padding:4px 2px 0}
.dial{width:46px;height:46px;border-radius:50%;border:1px solid var(--rule);position:relative;cursor:grab;touch-action:none;background:var(--paper)}
.dial i{position:absolute;left:50%;top:50%;width:40px;height:4px;margin:-2px 0 0 -20px;border-radius:2px;background:var(--ink);transform-origin:50% 50%}
.dial.dim{opacity:.35}
.dialrow .k{color:var(--muted);font-size:12px}
.dialrow .v{font:500 11px var(--f-mono)}
.menu{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 14px 40px var(--shadow);padding:4px;min-width:210px}
.menu button{display:flex;justify-content:space-between;gap:16px;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12.5px}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:#c4352b}
.menu button kbd{font:10px var(--f-mono);color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--rule);margin:4px 2px}
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,12,14,.35);padding:16px}
.sheet .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;width:min(640px,100%);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px var(--shadow)}
.sheet h3{margin:0;font:600 15px var(--f-ui)}
.sheet p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5;max-width:62ch}
.sheet textarea{width:100%;height:240px;font:11px/1.45 var(--f-mono);border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);padding:10px;resize:vertical}
.sheet .field{display:flex;flex-direction:column;gap:6px;color:var(--muted);font:10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.sheet .field input{width:100%;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);padding:9px 10px;font:14px var(--f-ui);outline:none}
.sheet .field input:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.new-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.new-options button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1px solid var(--rule);border-radius:9px;background:transparent;color:var(--ink);padding:10px;text-align:left;cursor:pointer}
.new-options button:hover{border-color:var(--muted)}
.new-options button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.new-options b{font:500 12.5px var(--f-ui)}
.new-options span{color:var(--muted);font-size:11.5px;line-height:1.4}
.check{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;cursor:pointer}
.check input{accent-color:var(--accent)}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:transparent;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
#toast.on{opacity:1;transform:translateX(-50%)}

.efoot .seg{margin:0}
.seg.icons{padding:2px}
.seg.icons button{flex:none;width:30px;height:26px;padding:0;display:grid;place-items:center}
.seg.icons svg{width:15px;height:15px}
.finerow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 10px 9px}
@media (max-width:760px){
  body{overflow:auto;display:block;height:auto}
  main{display:flex;flex-direction:column;gap:10px}
  #divider{display:none}
  #left{height:68vh} #right{height:60vh}
  .strip{width:64px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="mark">
    <span class="kicker">Stroke font</span>
    <input id="fontName" class="name" aria-label="Font name" spellcheck="false">
  </div>
  <div class="grow"></div>
  <button class="chip" id="brushChip" aria-label="Brush settings"><canvas id="chipCv"></canvas><span>Brush <b id="chipLbl">Pointed</b></span></button>
  <button class="ic" id="moreBtn" aria-label="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
</header>

<main id="main">
  <section class="pane" id="left">
    <div id="gridView"></div>
    <div id="editView" hidden>
      <div class="ehead">
        <button class="ic" id="eBack" aria-label="Back to all glyphs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="eglyph"><span id="eChar">a</span><span id="eCode">U+0061</span></div>
        <div class="vars" id="eVars"></div>
        <div class="grow"></div>
        <button class="ic" id="ePrev" aria-label="Previous glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 7l-5 5 5 5"/></svg></button>
        <button class="ic" id="eNext" aria-label="Next glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 7l5 5-5 5"/></svg></button>
      </div>
      <div class="ebody">
        <div class="strip">
          <div class="cap">Order</div>
          <div id="eList"></div>
          <button class="play" id="ePlay"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>Write</button>
        </div>
        <div class="stage" id="eStage"><canvas id="eCv"></canvas></div>
      </div>
      <div class="efoot">
        <div class="seg icons" id="eTool" role="group" aria-label="Tool">
          <button data-t="pen" title="Pen (P)" aria-label="Pen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 13.5c2-.4 3-1.4 3.6-2.6L11 4l1.5 1.5-6.9 4.9c-1.2.6-2.2 1.6-2.6 3.6z"/><path d="M10 5l1.5 1.5"/></svg></button>
          <button data-t="select" title="Select points (V)" aria-label="Select"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 2.5l8.5 5.2-3.9.9-1.8 3.7z"/></svg></button>
        </div>
        <div class="scrub" id="sSmooth" tabindex="0" role="slider"><span class="k">Smooth</span><span class="v"></span></div>
        <button class="tog" id="eFineBtn">Fine tune <b>show</b></button>
        <div class="seg icons" id="ePType" role="group" aria-label="Point type" hidden>
          <button data-p="corner" title="Corner: handles move independently"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 12L8 4l6 8"/><rect x="6" y="2" width="4" height="4" fill="currentColor" stroke="none"/></svg></button>
          <button data-p="smooth" title="Smooth: handles stay aligned, lengths free"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 12C4 4 12 4 14 12"/><path d="M3 6.5h10" stroke-dasharray="1.5 1.5"/><circle cx="8" cy="6.5" r="2" fill="currentColor" stroke="none"/></svg></button>
          <button data-p="sym" title="Symmetric: handles aligned and equal length"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 12C4 4 12 4 14 12"/><path d="M2.5 6.5h11" stroke-dasharray="1.5 1.5"/><path d="M8 4.3l2.2 2.2L8 8.7 5.8 6.5z" fill="currentColor" stroke="none"/></svg></button>
        </div>
        <span class="hint" id="eHint"></span>
      </div>
      <div class="finerow" id="fineRow" hidden>
        <div class="scrub" id="fSteady" tabindex="0" role="slider" title="Stabilises shaky input before fitting"><span class="k">Steady</span><span class="v"></span></div>
        <div class="scrub" id="fSimplify" tabindex="0" role="slider" title="Fewer points, longer curves"><span class="k">Simplify</span><span class="v"></span></div>
        <div class="scrub" id="fCorner" tabindex="0" role="slider" title="How readily sharp turns become corners"><span class="k">Corners</span><span class="v"></span></div>
        <div class="scrub" id="fTension" tabindex="0" role="slider" title="Handle length: tighter or fuller curves"><span class="k">Tension</span><span class="v"></span></div>
        <span class="hint">Drag a label · <kbd>⇧</kbd> for fine steps · double-click to reset</span>
      </div>
      </div>
    </div>
  </section>
  <div id="divider" aria-hidden="true"></div>
  <section class="pane" id="right">
    <textarea id="pText" spellcheck="false" aria-label="Preview text"></textarea>
    <div id="pWrap"><canvas id="preview"></canvas></div>
    <div class="pfoot">
      <div class="scrub" id="sSize" tabindex="0" role="slider"><span class="k">Size</span><span class="v"></span></div>
      <div class="scrub" id="sLead" tabindex="0" role="slider"><span class="k">Leading</span><span class="v"></span></div>
      <div class="scrub" id="sTrack" tabindex="0" role="slider"><span class="k">Tracking</span><span class="v"></span></div>
      <button class="tog" id="tAlt">Alternates <b></b></button>
      <button class="tog" id="tLig">Ligatures <b></b></button>
      <button class="tog" id="tGuide">Guides <b></b></button>
      <div class="grow"></div>
      <button class="tog" id="pPlay"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg><b>Write</b></button>
    </div>
  </section>
</main>

<div class="pop" id="brushPop" hidden>
  <canvas id="bSwatch"></canvas>
  <div class="seg" id="bModel">
    <button data-m="mono">Monoline</button><button data-m="broad">Broad nib</button><button data-m="pointed">Pointed</button>

<script>
(()=>{
"use strict";
// ───────────────────────── constants

const SETS=[

  {id:'uc',name:'Uppercase',chars:[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],adv:500},

const $=s=>document.querySelector(s);
const r1=v=>Math.round(v*10)/10;

const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ───────────────────────── geometry: fitting raw input → editable bezier nodes
function resample(pts,step){
  const out=[pts[0].slice()]; let prev=pts[0], acc=0;
  for(let i=1;i<pts.length;i++){
    const cur=pts[i]; let seg=dist(prev,cur);
    while(seg>0 && acc+seg>=step){
      const t=(step-acc)/seg; const np=[prev[0]+(cur[0]-prev[0])*t, prev[1]+(cur[1]-prev[1])*t];
      out.push(np); prev=np; seg=dist(prev,cur); acc=0;
    }
    acc+=seg; prev=cur;
  }
  const last=pts[pts.length-1];
  if(dist(out[out.length-1],last)>0.5) out.push(last.slice());
  return out;
}
function pathLen(p){let L=0;for(let i=1;i<p.length;i++)L+=dist(p[i-1],p[i]);return L}
function findCorners(p,thr){
  const n=p.length,w=3,ang=new Float32Array(n),idx=[];

    const a2=Math.atan2(p[i+w][1]-p[i][1],p[i+w][0]-p[i][0]);
    ang[i]=Math.abs(wrapA(a2-a1));
  }
  for(let i=w;i<n-w;i++){
    if(ang[i]>thr && ang[i]>=ang[i-1] && ang[i]>=ang[i+1]){
      if(!idx.length || i-idx[idx.length-1]>w*2) idx.push(i);

}

}

}
const nd=(x,y,c)=>({x,y,ix:x,iy:y,ox:x,oy:y,c:!!c,sy:false});
function fineOf(s){s=s??.4;return {steady:s,simplify:s,corner:.5,tension:.5}}
function autoHandles(N,ten){

    if(!B){P.ox=P.x;P.oy=P.y;P.ix=P.x+(A.x-P.x)/3;P.iy=P.y+(A.y-P.y)/3;continue}
    if(P.c){P.ix=P.x+(A.x-P.x)/3;P.iy=P.y+(A.y-P.y)/3;P.ox=P.x+(B.x-P.x)/3;P.oy=P.y+(B.y-P.y)/3;continue}
    let tx=B.x-A.x,ty=B.y-A.y; const tl=Math.hypot(tx,ty)||1; tx/=tl;ty/=tl;

  }

    const aim=(P,Q,hx,hy,key)=>{const dx=hx-P.x,dy=hy-P.y,l=Math.hypot(dx,dy)||1,L=Math.hypot(Q.x-P.x,Q.y-P.y)/3*ten;P[key+'x']=P.x+dx/l*L;P[key+'y']=P.y+dy/l*L};

function roundNode(o){return {x:r1(o.x),y:r1(o.y),ix:r1(o.ix),iy:r1(o.iy),ox:r1(o.ox),oy:r1(o.oy),c:!!o.c,sy:!!o.sy}}
// f: {steady: input stabilising, simplify: point reduction, corner: corner sensitivity, tension: curve fullness} — all 0..1
function fit(raw,f){
  if(typeof f==='number') f=fineOf(f);

}

// ───────────────────────── sampling & brush outline
function bez(a,b,c,d,t){const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d}
function samplesOf(N,step=5){
  const pts=[];
  for(let i=0;i<N.length-1;i++){
    const A=N[i],B=N[i+1];
    const len=(Math.hypot(A.ox-A.x,A.oy-A.y)+Math.hypot(B.ix-A.ox,B.iy-A.oy)+Math.hypot(B.x-B.ix,B.y-B.iy)+Math.hypot(B.x-A.x,B.y-A.y))/2;
    const m=Math.max(2,Math.ceil(len/step));
    for(let j=i?1:0;j<=m;j++){const t=j/m;pts.push([bez(A.x,A.ox,B.ix,B.x,t),bez(A.y,A.oy,B.iy,B.y,t)])}
  }
  if(N.length===1) pts.push([N[0].x,N[0].y]);
  return annotate(pts);
}
function annotate(pts){
  const n=pts.length,p=[]; let d=0;
  for(let i=0;i<n;i++){
    if(i) d+=dist(pts[i-1],pts[i]);
    const a0=pts[Math.max(0,i-1)],a1=pts[Math.min(n-1,i+1)];
    const a=(a0===a1)?0:Math.atan2(a1[1]-a0[1],a1[0]-a0[0]);
    p.push({x:pts[i][0],y:pts[i][1],a,d});
  }

}
const ease=u=>1-(1-u)*(1-u);
function quad(k,x1,y1,x2,y2,x3,y3,x4,y4){

  if(Math.abs(A)<1e-4) return;

    }
    for(let i=0;i<n-1;i++){

}

function arc(cx,cy,rx,ry,a0,a1){const n=Math.max(6,Math.ceil(Math.abs(a1-a0)/10)),o=[];for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;o.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}return o}

    y:[360,[[ln([65,X],[185,575]),ln([300,X],[130,D])]]],

// ───────────────────────── state
let F;
let UI={size:62,lead:1,track:0,alt:'cycle',lig:true,guides:false,split:56,fine:false,
  text:"the quick brown fox\njumps over the lazy dog.\nThe gift of a little\nstillness, offset by theft?"};
function load(){
  try{const s=localStorage.getItem(STORE);if(s){const o=JSON.parse(s);if(o&&o.F&&o.F.glyphs){F=o.F;Object.assign(UI,o.UI||{});return}}}catch(e){}
  F=sampleFont();
}
let saveT=0;
function migrate(){if(!F.fine)F.fine=fineOf(F.smooth??.4);delete F.smooth}
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(STORE,JSON.stringify({F,UI}))}catch(e){}},350)}
let HIST=[],HI=-1;
function snap(){const s=JSON.stringify(F);if(HIST[HI]===s)return;HIST=HIST.slice(0,HI+1);HIST.push(s);if(HIST.length>80)HIST.shift();HI=HIST.length-1;save()}
function restore(s){F=JSON.parse(s);migrate();rev++;clearSel();if(E.open&&!F.glyphs[E.key])ensureG(E.key);buildGrid();syncHeader();syncBrushUI();refreshEditor();req({all:1})}
function undo(){if(HI>0){HI--;restore(HIST[HI]);toast('Undone')}}
function redo(){if(HI<HIST.length-1){HI++;restore(HIST[HI]);toast('Redone')}}

load();migrate();
const G=k=>F.glyphs[k];
const hasInk=g=>!!g&&g.v.some(v=>v.s.length);
function setOf(k){for(const s of SETS)if(s.chars.includes(k))return s;return null}
function ensureG(k){
  if(!F.glyphs[k]){const s=setOf(k);F.glyphs[k]={adv:s?s.adv:(glen(k)>1?330*glen(k):400),cur:0,v:[{s:[]}]};
    if(!s) buildGrid();}
  return F.glyphs[k];
}
function codeOf(k){return Array.from(k).map(c=>'U+'+c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0')).join(' ')}

// ───────────────────────── colors
let COL={};

// node ops
const TYPE_NAME={corner:'Corner',smooth:'Smooth',sym:'Symmetric'};
function moveNode(P,dx,dy){P.x+=dx;P.y+=dy;P.ix+=dx;P.iy+=dy;P.ox+=dx;P.oy+=dy}
function moveStroke(st,dx,dy){st.n.forEach(P=>moveNode(P,dx,dy));st.raw.forEach(p=>{p[0]+=dx;p[1]+=dy})}
function setHandle(P,w,q,alt){
  const o=w==='o'?'i':'o';P[w+'x']=q.x;P[w+'y']=q.y;
  if(alt){P.c=true;P.sy=false;return}
  if(P.c)return;
  const dx=P.x-q.x,dy=P.y-q.y,l=Math.hypot(dx,dy)||1;
  const L=P.sy?l:Math.hypot(P[o+'x']-P.x,P[o+'y']-P.y);if(L<.5)return;
  P[o+'x']=P.x+dx/l*L;P[o+'y']=P.y+dy/l*L;
}
function typeOf(P){return P.c?'corner':P.sy?'sym':'smooth'}
function alignHandles(st,ni,eq){
  const N=st.n,P=N[ni],A=N[ni-1],B=N[ni+1];
  let li=Math.hypot(P.ix-P.x,P.iy-P.y),lo=Math.hypot(P.ox-P.x,P.oy-P.y),dx=P.ox-P.ix,dy=P.oy-P.iy,l=Math.hypot(dx,dy);
  if(l<.5||li<.5||lo<.5){dx=B.x-A.x;dy=B.y-A.y;l=Math.hypot(dx,dy)||1;if(li<.5)li=Math.hypot(P.x-A.x,P.y-A.y)/3;if(lo<.5)lo=Math.hypot(B.x-P.x,B.y-P.y)/3}
  dx/=l;dy/=l;if(eq){const m=(li+lo)/2;li=lo=m}
  P.ix=P.x-dx*li;P.iy=P.y-dy*li;P.ox=P.x+dx*lo;P.oy=P.y+dy*lo;
}
function setType(st,ni,t){const P=st.n[ni],end=ni===0||ni===st.n.length-1;P.c=t==='corner';P.sy=t==='sym';if(!end&&t!=='corner')alignHandles(st,ni,t==='sym')}
function cycleType(st,ni){const t=typeOf(st.n[ni]);setType(st,ni,t==='smooth'?'sym':t==='sym'?'corner':'smooth')}
function applyType(t){
  const v=curV();const targets=E.pts.size?selPts().map(o=>[o.st,o.ni]):activeStrokes().flatMap(si=>v.s[si].n.map((_,ni)=>[v.s[si],ni]));
  if(!targets.length)return;targets.forEach(([st,ni])=>{setType(st,ni,t);st.e=1});activeStrokes().forEach(si=>{v.s[si].n=v.s[si].n.map(roundNode)});
  commit(E.key);updateSelUI();toast(`${targets.length} point${targets.length>1?'s':''} set to ${TYPE_NAME[t].toLowerCase()}`);
}
function splitAt(st,i,t){
  const A=st.n[i],B=st.n[i+1],L=(a,b)=>a+(b-a)*t;
  const x01=L(A.x,A.ox),y01=L(A.y,A.oy),x12=L(A.ox,B.ix),y12=L(A.oy,B.iy),x23=L(B.ix,B.x),y23=L(B.iy,B.y);
  const x012=L(x01,x12),y012=L(y01,y12),x123=L(x12,x23),y123=L(y12,y23),x=L(x012,x123),y=L(y012,y123);
  A.ox=x01;A.oy=y01;B.ix=x23;B.iy=y23;st.n.splice(i+1,0,{x,y,ix:x012,iy:y012,ox:x123,oy:y123,c:false,sy:false});return i+1;
}
function reverseStroke(st){st.n.reverse().forEach(P=>{[P.ix,P.ox]=[P.ox,P.ix];[P.iy,P.oy]=[P.oy,P.iy]});st.raw.reverse()}
function addStroke(raw){const v=curV();v.s.push(mkStroke(raw,F.fine));commit(E.key);updateStrip()}
function scheduleDot(q){clearTimeout(E.dotT);E.dotT=setTimeout(()=>addStroke(dt(q.x,q.y)),240)}
function deleteSel(){
  const v=curV();
  if(E.pts.size){const by={};selPts().forEach(o=>{(by[o.si]=by[o.si]||[]).push(o.ni)});
    Object.keys(by).map(Number).sort((a,b)=>b-a).forEach(si=>{const st=v.s[si];by[si].sort((a,b)=>b-a).forEach(ni=>st.n.splice(ni,1));st.e=1;if(st.n.length<2)v.s.splice(si,1)})}
  else if(E.sel>=0)v.s.splice(E.sel,1);else return;
  clearSel();commit(E.key);updateSelUI();
}
function nudge(dx,dy){const v=curV();if(E.pts.size)selPts().forEach(o=>{moveNode(o.P,dx,dy);o.st.e=1});else activeStrokes().forEach(si=>moveStroke(v.s[si],dx,dy));commit(E.key)}
function selectAll(){const v=curV();clearSel();v.s.forEach((st,si)=>st.n.forEach((_,ni)=>E.pts.add(pk(si,ni))));if(v.s.length)E.sel=0;updateSelUI();req({editor:1})}

// copy & paste paths
let CLIP=null,hoverCell=null,pasteSeen=false;
function strokesForCopy(){const v=curV();return activeStrokes().map(i=>JSON.parse(JSON.stringify(v.s[i])))}
function clipText(strokes){return JSON.stringify({format:'stroke-font-paths/1',strokes:strokes.map(s=>({raw:s.raw,s:s.s,f:s.f||fineOf(s.s),e:s.e?1:0,n:s.n}))})}
function doCopy(cut){
  const s=strokesForCopy();if(!s.length)return null;CLIP=s;
  if(cut){const v=curV();activeStrokes().sort((a,b)=>b-a).forEach(i=>v.s.splice(i,1));clearSel();commit(E.key);updateSelUI()}
  toast(`${cut?'Cut':'Copied'} ${s.length} path${s.length>1?'s':''}`);return clipText(s);
}
function pasteInto(key,strokes,inPlace){
  const g=ensureG(key),v=g.v[g.cur];strokes=JSON.parse(JSON.stringify(strokes));
  if(!inPlace){let off=0;const clash=()=>v.s.some(t=>strokes.some(s=>Math.abs(t.n[0].x-(s.n[0].x+off))<.6&&Math.abs(t.n[0].y-(s.n[0].y+off))<.6));while(clash()&&off<480)off+=24;if(off)strokes.forEach(s=>moveStroke(s,off,off))}
  const start=v.s.length;strokes.forEach(s=>v.s.push(s));
  const here=E.open&&E.key===key;
  if(here){selectStrokes(strokes.map((_,i)=>start+i));}
  commit(key);if(here)updateSelUI();
  toast(`Pasted ${strokes.length} path${strokes.length>1?'s':''}${here?'':` into "${key}"`}`);
}
function duplicateSel(){const s=strokesForCopy();if(!s.length)return;CLIP=s;pasteInto(E.key,s,false)}
function parseClip(txt){
  txt=(txt||'').trim();if(!txt)return null;
  if(txt[0]==='{'){try{const o=JSON.parse(txt);if(o.format==='stroke-font-paths/1'&&Array.isArray(o.strokes))return {own:true,strokes:o.strokes.map(s=>({raw:s.raw||s.n.map(p=>[p.x,p.y]),s:s.s??.4,f:s.f||fineOf(s.s),e:s.e||0,n:s.n.map(p=>roundNode(p))}))}}catch(e){}return null}
  const sv=svgToStrokes(txt);return sv&&sv.length?{own:false,strokes:sv}:null;
}
function svgToStrokes(txt){
  const ds=[];
  if(txt.includes('<')){const re=/\sd\s*=\s*"([^"]*)"|\sd\s*=\s*'([^']*)'/g;let m;while((m=re.exec(txt)))ds.push(m[1]||m[2])}
  else if(/^[Mm][\s\d.,+-]/.test(txt))ds.push(txt);else return null;
  const subs=[];
  for(const d of ds){
    const tk=d.match(/[a-zA-Z]|[-+]?(?:\d*\.\d+|\d+\.?)(?:[eE][-+]?\d+)?/g)||[];
    let i=0,cmd='',x=0,y=0,sx=0,sy=0,cur=null,lc=null;
    const num=()=>parseFloat(tk[i++]),isN=()=>i<tk.length&&!/^[a-zA-Z]$/.test(tk[i]);
    const start=(px,py)=>{cur=[{x:px,y:py,ix:px,iy:py,ox:px,oy:py}];subs.push(cur);sx=px;sy=py};
    const lineTo=(px,py)=>{if(!cur)start(x,y);cur.push({x:px,y:py,ix:px,iy:py,ox:px,oy:py});x=px;y=py;lc=null};
    const cubic=(x1,y1,x2,y2,px,py)=>{if(!cur)start(x,y);const L=cur[cur.length-1];L.ox=x1;L.oy=y1;cur.push({x:px,y:py,ix:x2,iy:y2,ox:px,oy:py});x=px;y=py;lc=[x2,y2]};
    while(i<tk.length){
      if(/^[a-zA-Z]$/.test(tk[i]))cmd=tk[i++];
      const rel=cmd===cmd.toLowerCase(),C=cmd.toUpperCase(),ox=rel?x:0,oy=rel?y:0;
      if(C==='Z'){if(cur&&(Math.abs(x-sx)>.01||Math.abs(y-sy)>.01))lineTo(sx,sy);x=sx;y=sy;cur=null;continue}
      if(!isN()){i++;continue}
      if(C==='M'){const px=num()+ox,py=num()+oy;start(px,py);x=px;y=py;lc=null;cmd=rel?'l':'L'}
      else if(C==='L'){const px=num()+ox,py=num()+oy;lineTo(px,py)}
      else if(C==='H'){lineTo(num()+(rel?x:0),y)}
      else if(C==='V'){lineTo(x,num()+(rel?y:0))}
      else if(C==='C'){const a=num()+ox,b=num()+oy,c=num()+ox,e=num()+oy,f=num()+ox,h=num()+oy;cubic(a,b,c,e,f,h)}
      else if(C==='S'){const r=lc?[2*x-lc[0],2*y-lc[1]]:[x,y];const c=num()+ox,e=num()+oy,f=num()+ox,h=num()+oy;cubic(r[0],r[1],c,e,f,h)}
      else if(C==='Q'||C==='T'){let qx,qy;if(C==='Q'){qx=num()+ox;qy=num()+oy}else{qx=lc?2*x-lc[0]:x;qy=lc?2*y-lc[1]:y}const f=num()+ox,h=num()+oy;cubic(x+2/3*(qx-x),y+2/3*(qy-y),f+2/3*(qx-f),h+2/3*(qy-h),f,h);lc=[qx,qy]}
      else if(C==='A'){num();num();num();num();num();const px=num()+ox,py=num()+oy;lineTo(px,py)}
      else i++;
    }
  }
  const good=subs.filter(s=>s.length>1);if(!good.length)return null;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;good.forEach(s=>s.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}));
  const adv=E.open?curG().adv:400,bw=Math.max(1,x1-x0),bh=Math.max(1,y1-y0),sc=Math.min((M.base-M.asc)/bh,(adv*1.3)/bw);
  const tx=p=>40+(p-x0)*sc,ty=p=>M.base-(y1-p)*sc;
  return good.map(s=>{
    const n=s.map(p=>({x:tx(p.x),y:ty(p.y),ix:tx(p.ix),iy:ty(p.iy),ox:tx(p.ox),oy:ty(p.oy),c:false,sy:false}));
    n.forEach((P,i)=>{if(i===0||i===n.length-1)return;const zi=Math.hypot(P.x-P.ix,P.y-P.iy)<.5,zo=Math.hypot(P.ox-P.x,P.oy-P.y)<.5;
      P.c=zi||zo||Math.abs(wrapA(Math.atan2(P.oy-P.y,P.ox-P.x)-Math.atan2(P.y-P.iy,P.x-P.ix)))>.15});
    const nn=n.map(roundNode);return {raw:samplesOf(nn,4).p.map(q=>[r1(q.x),r1(q.y)]),s:.4,f:{...F.fine},e:1,n:nn};
  });
}
function hasTextSel(){const s=window.getSelection&&window.getSelection();return !!(s&&s.toString().length)}
const isTyping=t=>!!t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
function handleCopy(e,cut){
  if(isTyping(e.target)||hasTextSel())return;let txt=null;
  if(E.open)txt=doCopy(cut);
  else if(hoverCell){const g=G(hoverCell);if(hasInk(g)){CLIP=JSON.parse(JSON.stringify(g.v[g.cur].s));txt=clipText(CLIP);if(cut){g.v[g.cur].s=[];commit(hoverCell)}toast(`${cut?'Cut':'Copied'} paths of "${hoverCell}"`)}}
  if(txt&&e.clipboardData){e.clipboardData.setData('text/plain',txt);e.preventDefault()}
}
document.addEventListener('copy',e=>handleCopy(e,false));
document.addEventListener('cut',e=>handleCopy(e,true));
document.addEventListener('paste',e=>{
  if(isTyping(e.target))return;pasteSeen=true;const key=E.open?E.key:hoverCell;if(!key)return;e.preventDefault();
  const p=parseClip(e.clipboardData&&e.clipboardData.getData('text/plain'));
  if(p){if(p.own)CLIP=p.strokes;pasteInto(key,p.strokes,!p.own)}
  else if(CLIP)pasteInto(key,CLIP,false);
  else toast('Nothing to paste. Copy paths here, or SVG path data from another app.');
});
function copyMenu(cut){const t=doCopy(cut);if(t&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(()=>{})}

eCv.addEventListener('pointerdown',e=>{
  if(e.button!==0||!E.tf)return;stopAnim();
  const g=curG(),v=curV(),q=toG(e),px=1/E.tf.k;eCv.setPointerCapture(e.pointerId);
  const D={sx:q.sx,sy:q.sy,q,last:q,moved:false,type:'empty',shift:e.shiftKey,box:E.tool==='select'||e.metaKey||e.ctrlKey};
  const hh=hitHandleA(q,8*px),hn=hh?null:hitNodeA(q,8*px);
  if(hh){D.type='handle';D.si=hh.si;D.ni=hh.i;D.w=hh.w}
  else if(hn){const key=pk(hn.si,hn.ni);D.key=key;D.si=hn.si;
    if(e.shiftKey){if(E.pts.has(key))E.pts.delete(key);else E.pts.add(key);D.type='none'}
    else{D.wasIn=E.pts.has(key);if(!D.wasIn)E.pts=new Set([key]);E.sel=hn.si;D.type='nodes'}}
  else if(Math.abs(q.x-g.adv)*E.tf.k<8&&q.y>M.asc-50&&q.y<M.desc+60){D.type='adv'}
  else if(E.tool==='pen'&&e.shiftKey&&!D.box&&v.s.length){D.type='moveAll'}
  else{const tol=tolFor(),on=activeStrokes().find(si=>strokeDist(v.s[si],q)<tol);
    if(on!=null&&!e.shiftKey){D.type='moveSel';D.si=on}
    else{const si=hitAny(v,q,tol);if(si>=0){D.type='maybe';D.si=si}}}
  E.drag=D;updateSelUI();req({editor:1});
});
eCv.addEventListener('pointermove',e=>{
  if(!E.tf)return;const q=toG(e),v=curV(),g=curG();
  if(!E.drag){
    if(E.anim)return;
    const px=1/E.tf.k;let cur=E.tool==='select'?'default':'crosshair',hov=-1,adv=false;
    if(hitHandleA(q,8*px)||hitNodeA(q,8*px))cur='pointer';
    else if(Math.abs(q.x-g.adv)*E.tf.k<8&&q.y>M.asc-50&&q.y<M.desc+60){cur='ew-resize';adv=true}
    else if(activeStrokes().some(si=>strokeDist(v.s[si],q)<tolFor()))cur='move';
    else{hov=hitAny(v,q,tolFor());if(hov>=0)cur=E.tool==='select'?'move':'pointer'}
    if(e.shiftKey&&E.tool==='pen'&&v.s.length&&cur==='crosshair')cur='move';
    eCv.style.cursor=cur;if(hov!==E.hover||adv!==!!E.advHot){E.hover=hov;E.advHot=adv;req({editor:1})}
    return;
  }
  const D=E.drag;
  if(!D.moved&&Math.hypot(q.sx-D.sx,q.sy-D.sy)>3){D.moved=true;
    if(D.type==='maybe'&&E.tool==='select'&&!D.shift){clearSel();E.sel=D.si;D.type='moveSel'}
    else if(D.type==='maybe'||D.type==='empty'){
      if(D.box){D.type='marq';if(!D.shift)clearSel();E.marq={x0:D.sx,y0:D.sy,x1:q.sx,y1:q.sy}}
      else{D.type='draw';E.raw=[[D.q.x,D.q.y]];clearSel();clearTimeout(E.dotT)}}
  }
  if(!D.moved)return;
  const dx=q.x-D.last.x,dy=q.y-D.last.y;D.last=q;
  switch(D.type){
    case 'draw':if(dist([q.x,q.y],E.raw[E.raw.length-1])>1.2)E.raw.push([q.x,q.y]);break;
    case 'marq':E.marq.x1=q.sx;E.marq.y1=q.sy;break;
    case 'adv':g.adv=Math.round(Math.max(40,q.x));break;
    case 'handle':{const st=v.s[D.si];setHandle(st.n[D.ni],D.w,q,e.altKey);st.e=1;break}
    case 'nodes':selPts().forEach(o=>{moveNode(o.P,dx,dy);o.st.e=1});break;
    case 'moveSel':activeStrokes().forEach(si=>moveStroke(v.s[si],dx,dy));break;
    case 'moveAll':v.s.forEach(s=>moveStroke(s,dx,dy));break;
  }
  if(D.type==='draw'||D.type==='marq'||D.type==='none')req({editor:1});else touched(E.key);
});
function edUp(){
  const D=E.drag;if(!D)return;E.drag=null;const v=curV();
  if(D.type==='draw'){if(E.raw&&E.raw.length>1)addStroke(E.raw);E.raw=null}
  else if(D.type==='marq'){
    const m=E.marq,T=E.tf;E.marq=null;
    const x0=(Math.min(m.x0,m.x1)-T.ox)/T.k,x1=(Math.max(m.x0,m.x1)-T.ox)/T.k,y0=(Math.min(m.y0,m.y1)-T.oy)/T.k,y1=(Math.max(m.y0,m.y1)-T.oy)/T.k;
    v.s.forEach((st,si)=>st.n.forEach((P,ni)=>{if(P.x>=x0&&P.x<=x1&&P.y>=y0&&P.y<=y1)E.pts.add(pk(si,ni))}));
    const a=activeStrokes();if(E.sel<0&&a.length)E.sel=a[0];
  }
  else if(!D.moved){
    if(D.type==='maybe'){
      if(D.shift){if(E.sel>=0&&!E.pts.size)v.s[E.sel].n.forEach((_,ni)=>E.pts.add(pk(E.sel,ni)));v.s[D.si].n.forEach((_,ni)=>E.pts.add(pk(D.si,ni)));if(E.sel<0)E.sel=D.si}
      else{clearSel();E.sel=D.si}
    }
    else if(D.type==='empty'){if(activeStrokes().length)clearSel();else if(E.tool==='pen')scheduleDot(D.q)}
    else if(D.type==='moveSel'){if(!D.shift){clearSel();E.sel=D.si}}
    else if(D.type==='nodes'&&D.wasIn&&E.pts.size>1){E.pts=new Set([D.key])}
  } else if(['adv','handle','nodes','moveSel','moveAll'].includes(D.type)){
    (D.type==='moveAll'?v.s:activeStrokes().map(si=>v.s[si])).forEach(st=>{st.n=st.n.map(roundNode)});
    commit(E.key);
  }
  updateSelUI();req({editor:1});
}
eCv.addEventListener('pointerup',edUp);
eCv.addEventListener('pointercancel',()=>{E.drag=null;E.raw=null;E.marq=null;req({editor:1})});
eCv.addEventListener('pointerleave',()=>{if(!E.drag&&(E.hover>=0||E.advHot)){E.hover=-1;E.advHot=false;req({editor:1})}});
eCv.addEventListener('dblclick',e=>{
  clearTimeout(E.dotT);const act=activeStrokes();if(!act.length)return;const v=curV(),q=toG(e),px=1/E.tf.k;
  const hn=hitNodeA(q,8*px);
  if(hn){const st=v.s[hn.si];cycleType(st,hn.ni);st.n=st.n.map(roundNode);st.e=1;E.pts=new Set([pk(hn.si,hn.ni)]);commit(E.key);updateSelUI();toast(TYPE_NAME[typeOf(st.n[hn.ni])]+' point');return}
  for(const si of act){const st=v.s[si],hs=hitSeg(st,q,tolFor());if(!hs)continue;
    const ni=splitAt(st,hs.i,hs.t),np=new Set();E.pts.forEach(k=>{const [a,b]=k.split(':').map(Number);np.add(a===si&&b>hs.i?pk(a,b+1):k)});np.add(pk(si,ni));
    E.pts=np;E.sel=si;st.n=st.n.map(roundNode);st.e=1;commit(E.key);updateSelUI();return}
});
eCv.addEventListener('contextmenu',e=>{
  e.preventDefault();if(!E.tf)return;const v=curV(),q=toG(e),si=hitAny(v,q,tolFor());
  if(si>=0&&!activeStrokes().includes(si)){clearSel();E.sel=si;updateSelUI();req({editor:1})}
  const has=activeStrokes().length,items=[];
  if(has)items.push({label:'Copy',kbd:MOD+'C',fn:()=>copyMenu(false)},{label:'Cut',kbd:MOD+'X',fn:()=>copyMenu(true)},{label:'Duplicate',kbd:MOD+'D',fn:duplicateSel});
  if(CLIP)items.push({label:'Paste',kbd:MOD+'V',fn:()=>pasteInto(E.key,CLIP,false)});
  if(has)items.push('-',{label:'Corner points',fn:()=>applyType('corner')},{label:'Smooth points',fn:()=>applyType('smooth')},{label:'Symmetric points',fn:()=>applyType('sym')},
    {label:'Reverse direction',fn:()=>{const a=activeStrokes();a.forEach(i=>reverseStroke(v.s[i]));selectStrokes(a);commit(E.key);updateSelUI()}},'-',{label:'Delete',kbd:'⌫',danger:1,fn:deleteSel});
  if(items.length)items.push('-');items.push({label:'Select all points',kbd:MOD+'A',fn:selectAll});
  showMenu(items,e.clientX,e.clientY);
});
new ResizeObserver(()=>req({editor:1})).observe($('#eStage'));

function updateHint(){
  const h=$('#eHint');
  if(activeStrokes().length) h.innerHTML='Drag points to move them together · <kbd>⇧</kbd>-click adds points · <kbd>⌥</kbd> breaks a handle · double-click a point to cycle smooth, symmetric, corner · <kbd>'+MOD+'C</kbd> <kbd>'+MOD+'V</kbd> copy and paste paths';
  else if(E.tool==='select') h.innerHTML='Drag a box to select points · drag a stroke to move it · <kbd>⇧</kbd> adds to the selection · <kbd>P</kbd> back to pen';
  else h.innerHTML='Draw to add a stroke · click a stroke to edit · <kbd>'+MOD.replace('+','')+'</kbd>-drag box-selects points · tap for a dot · <kbd>V</kbd> select tool';
}
function updateSelUI(){

function copyText(txt,ok){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(ok),()=>openSheet('Copy manually','Your browser blocked the clipboard. Select the text below and copy it.',txt,false))}else openSheet('Copy manually','Select the text below and copy it.',txt,false)}
function fontObject(){return StrokeFontObject.toFontObject(F,M,fineOf)}
function exportData(pretty=false){return JSON.stringify(fontObject(),null,pretty?2:0)}
function downloadFontObject(){
  const blob=new Blob([exportData(true)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=StrokeFontObject.safeFilename(F.name);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0);toast('Font object exported');
}
function importData(txt){
  const o=JSON.parse(txt);if(!o||!o.glyphs)throw new Error('No glyphs found');const glyphs={};
  for(const k in o.glyphs){const g=o.glyphs[k];glyphs[k]={adv:g.adv||400,cur:0,v:(g.variants||[]).map(v=>({s:(v.strokes||[]).map(s=>{const n=(s.nodes||[]).map(a=>({x:a[0],y:a[1],ix:a[2],iy:a[3],ox:a[4],oy:a[5],c:a[6]===1,sy:a[6]===2}));return {s:s.smooth??.4,f:s.fine||fineOf(s.smooth),n,raw:s.raw||n.map(p=>[p.x,p.y]),e:s.raw?0:1}})}))};if(!glyphs[k].v.length)glyphs[k].v=[{s:[]}]}
  F={name:o.name||'Imported font',fine:F.fine,brush:Object.assign({},F.brush,o.brush||{}),glyphs};
}
function openSheet(title,desc,text,canLoad){
  closePops();const s=document.createElement('div');s.className='sheet';
  s.innerHTML=`<div class="card" role="dialog" aria-label="${title}"><h3></h3><p></p><textarea id="sheetTa" spellcheck="false"></textarea><div class="acts">${canLoad?'<button class="btn" data-a="file">Choose file…</button><button class="btn" data-a="load">Load this text</button>':''}<button class="btn" data-a="close">Close</button><button class="btn pri" data-a="copy">Copy</button></div></div>`;
  s.querySelector('h3').textContent=title;s.querySelector('p').textContent=desc;const ta=s.querySelector('textarea');ta.value=text;
  s.addEventListener('click',e=>{if(e.target===s){s.remove();return}const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
    if(a==='close')s.remove();
    if(a==='copy'){ta.select();if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast('Copied'),()=>toast('Press ⌘C / Ctrl+C to copy'));}
    if(a==='load'){try{importData(ta.value);snap();restore(HIST[HI]);s.remove();toast('Font loaded')}catch(err){toast('That text is not stroke-font JSON')}}
    if(a==='file')$('#fileIn').click();});
  document.body.appendChild(s);ta.focus();ta.select();
}
function openNewFontSheet(){
  closePops();const s=document.createElement('div');s.className='sheet';
  s.innerHTML=`<div class="card" role="dialog" aria-labelledby="newFontTitle"><h3 id="newFontTitle">Create a new font</h3><p>Start with a clean character set, or make a fresh copy of the built-in sample. Your current font remains available through Undo until this page is closed.</p><label class="field"><span>Font name</span><input id="newFontName" maxlength="80" value="Untitled stroke font" autocomplete="off"></label><div class="new-options" role="group" aria-label="Starting point"><button class="on" type="button" data-template="blank"><b>Blank font</b><span>Empty lowercase, uppercase, figures, and punctuation.</span></button><button type="button" data-template="sample"><b>Sample font</b><span>A fresh Ledger Hand font to edit and rename.</span></button></div><label class="check" id="keepBrushRow"><input id="keepBrush" type="checkbox" checked> Keep the current brush settings</label><div class="acts"><button class="btn" type="button" data-a="cancel">Cancel</button><button class="btn pri" type="button" data-a="create">Create font</button></div></div>`;
  let template='blank';const name=s.querySelector('#newFontName'),keepRow=s.querySelector('#keepBrushRow');
  s.querySelector('.new-options').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;template=b.dataset.template;s.querySelectorAll('.new-options button').forEach(x=>x.classList.toggle('on',x===b));keepRow.hidden=template!=='blank'});
  const create=()=>{const fontName=name.value.trim()||'Untitled stroke font';F=template==='sample'?sampleFont():blankFont(fontName,s.querySelector('#keepBrush').checked);F.name=fontName;snap();restore(HIST[HI]);s.remove();toast(`Created “${fontName}”`)};
  s.addEventListener('click',e=>{if(e.target===s||e.target.dataset?.a==='cancel')s.remove();if(e.target.dataset?.a==='create')create()});
  name.addEventListener('keydown',e=>{if(e.key==='Enter')create();if(e.key==='Escape')s.remove()});
  document.body.appendChild(s);name.focus();name.select();
}
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{importData(r.result);snap();restore(HIST[HI]);closePops();toast('Font loaded')}catch(err){toast('That file is not stroke-font JSON')}};r.readAsText(f);e.target.value=''});
function previewSVG(){
  const L=layout(),w=pWrap.clientWidth,H=L.pad*2+L.lines*L.lineH,k=L.k;let paths='';
  L.items.forEach(it=>{if(!it.v)return;const oy=L.pad+it.line*L.lineH-(M.asc-30)*k;const sk=svgSink(it.x,oy,k);it.v.s.forEach(st=>outline(samplesOf(st.n),F.brush,sk));paths+=sk.o.join('')});
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Math.round(w)} ${Math.round(H)}" width="${Math.round(w)}" height="${Math.round(H)}"><path fill="#111" d="${paths}"/></svg>`;
}
function glyphSVG(){const g=curG(),v=curV(),sk=svgSink(0,0,1);v.s.forEach(st=>outline(samplesOf(st.n),F.brush,sk));
  const cl=v.s.map(st=>`<path d="M${st.n[0].x} ${st.n[0].y}${st.n.slice(1).map((B,i)=>{const A=st.n[i];return `C${A.ox} ${A.oy} ${B.ix} ${B.iy} ${B.x} ${B.y}`}).join('')}"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 ${M.asc-60} ${g.adv} ${M.desc-M.asc+120}"><path fill="#111" d="${sk.o.join('')}"/><g fill="none" stroke="#2b44d3" stroke-width="2" data-role="centerlines">${cl}</g></svg>`}
$('#moreBtn').addEventListener('click',e=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();const mac=/Mac|iPhone|iPad/.test(navigator.platform);const m=mac?'⌘':'Ctrl+';
  const items=[{label:'Undo',kbd:m+'Z',fn:undo},{label:'Redo',kbd:(mac?'⇧⌘':'Ctrl+Shift+')+'Z',fn:redo},'-',
    {label:'New font…',fn:openNewFontSheet},
    {label:'Export font object (.json)',fn:downloadFontObject},
    {label:'View or import font data…',fn:()=>openSheet('Font data','Stroke font JSON: metrics, brush, and every glyph with its centerline nodes and the raw pen input. Copy it to keep a backup, or paste a file here and load it.',exportData(true),true)},
    {label:'Copy preview as SVG',fn:()=>copyText(previewSVG(),'Preview SVG copied')}];
  if(E.open)items.push({label:`Copy "${E.key}" as SVG`,fn:()=>copyText(glyphSVG(),'Glyph SVG copied (outline + centerlines)')});
  items.push('-',{label:'Load sample font',confirm:'Replaces current font. Click again',fn:()=>{F=sampleFont();snap();restore(HIST[HI]);toast('Sample font loaded')}},
    {label:'Clear all glyphs',danger:1,confirm:'Click again to clear everything',fn:()=>{for(const k in F.glyphs)F.glyphs[k]={adv:F.glyphs[k].adv,cur:0,v:[{s:[]}]};snap();restore(HIST[HI]);toast('All glyphs cleared. Undo restores them.')}});
  showMenu(items,r.right-220,r.bottom+6)});

// ───────────────────────── header, divider, keyboard
const nameIn=$('#fontName');
function syncHeader(){nameIn.value=F.name}
nameIn.addEventListener('change',()=>{F.name=nameIn.value.trim()||'Untitled stroke font';syncHeader();snap()});
nameIn.addEventListener('keydown',e=>{if(e.key==='Enter')nameIn.blur()});
(()=>{const d=$('#divider'),main=$('#main');let on=false;
  d.addEventListener('pointerdown',e=>{on=true;d.setPointerCapture(e.pointerId)});
  d.addEventListener('pointermove',e=>{if(!on)return;const r=main.getBoundingClientRect();UI.split=clamp((e.clientX-r.left)/r.width*100,28,74);main.style.setProperty('--lw',UI.split+'%')});
  d.addEventListener('pointerup',()=>{on=false;save()});
  d.addEventListener('dblclick',()=>{UI.split=56;main.style.setProperty('--lw','56%');save()});})();
document.addEventListener('keydown',e=>{
  const t=e.target,typing=isTyping(t),mod=e.metaKey||e.ctrlKey,key=e.key.toLowerCase();
  if(mod&&key==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&key==='y'&&!typing){e.preventDefault();redo();return}
  if(mod&&key==='v'&&!typing){pasteSeen=false;setTimeout(()=>{if(!pasteSeen&&CLIP){const k=E.open?E.key:hoverCell;if(k)pasteInto(k,CLIP,false)}},80);return}
  if(e.key==='Escape'){if(closePops())return;if(typing){t.blur();return}if(E.open){if(activeStrokes().length){clearSel();updateSelUI();req({editor:1})}else closeEditor()}return}
  if(typing||!E.open)return;
  if(mod&&key==='a'){e.preventDefault();selectAll();return}
  if(mod&&key==='d'){e.preventDefault();duplicateSel();return}
  if(mod)return;
  const act=activeStrokes();
  if(e.key==='Delete'||e.key==='Backspace'){if(!act.length)return;e.preventDefault();deleteSel();return}
  if(e.key.startsWith('Arrow')){e.preventDefault();
    if(!act.length){if(e.key==='ArrowLeft')stepGlyph(-1);if(e.key==='ArrowRight')stepGlyph(1);return}
    const s=e.shiftKey?10:e.altKey?.5:2;nudge(e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0,e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0);return}
  if(e.key==='['||e.key===']'){const g=curG();g.cur=(g.cur+(e.key===']'?1:-1)+g.v.length)%g.v.length;clearSel();commit(E.key);refreshEditor();return}
  if(key==='v'||key==='p'){E.tool=key==='v'?'select':'pen';eCv.style.cursor=E.tool==='select'?'default':'crosshair';updateSelUI();return}
  if(key==='w'){playEditor();return}
});

// ───────────────────────── theme & boot
function themeChanged(){readColors();req({all:1});updateStrip()}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged);
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
new ResizeObserver(()=>req({all:1})).observe(gridView);

readColors();
window.StrokeFontStudio={
  exportFontObject:()=>JSON.parse(exportData()),
  createBlankFont:name=>{F=blankFont(name,false);snap();restore(HIST[HI]);return JSON.parse(exportData())}
};
$('#main').style.setProperty('--lw',UI.split+'%');
pText.value=UI.text;syncFineRow();syncHeader();syncToggles();syncBrushUI();buildGrid();updateHint();
HIST=[JSON.stringify(F)];HI=0;
req({all:1});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>req({all:1}));
})();
</script>
