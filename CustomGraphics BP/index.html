<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>p5.js Sketch - Custom Graphics</title>
    <meta name="description" content="Interactive p5.js sketch">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0e0f13;
        color: #eaecef;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      .overlay {
        position: fixed;
        left: 16px;
        bottom: 16px;
        background: rgba(14, 15, 19, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 10px 12px;
        backdrop-filter: blur(6px);
        font-size: 12px;
        line-height: 1.4;
        user-select: none;
        pointer-events: none;
        max-width: min(92vw, 520px);
        color: #cfd6dd;
      }
      .overlay kbd {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-bottom-width: 2px;
        padding: 2px 6px;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="overlay">
      Click to add or drag points. Scroll to change size. Press <kbd>S</kbd> to save.
    </div>

    <!-- p5.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>
    <!-- Sketch code -->
    <script src="./sketch.js"></script>
  </body>
</html>
