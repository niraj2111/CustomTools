<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stroke Canvas</title>
<style>
:root{
  --ui:rgba(30,30,32,.86);--ui2:#1e1e20;--fg:#f3f3f1;--mut:#8e8e93;--line:rgba(255,255,255,.09);
  --hi:rgba(255,255,255,.13);--acc:#fff;--st:env(safe-area-inset-top,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2a2c;color:var(--fg);
  font:13px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#ov{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.panel{position:fixed;background:var(--ui);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
  border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18),0 0 0 .5px rgba(255,255,255,.06) inset;z-index:5}
.top{top:calc(10px + var(--st));right:calc(10px + var(--sr));display:flex;gap:2px;padding:4px}
.btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--fg);opacity:.72;transition:background .15s,opacity .15s}
.btn.on{opacity:1;background:var(--hi)}
.btn:active{background:var(--hi)}
.dot{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 0 3px rgba(0,0,0,.25);position:relative}
.dot.mul::after{content:'';position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;border-radius:50%;background:rgba(80,170,255,.75);box-shadow:-5px -3px 0 rgba(255,210,60,.75),0 0 0 1.5px #1e1e20}
#colBtn{opacity:1}
.side{left:calc(8px + var(--sl));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 6px}
.vs{width:28px;height:150px;border-radius:14px;background:rgba(255,255,255,.07);position:relative;touch-action:none;overflow:hidden}
.vs .f{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.16)}
.vs .k{position:absolute;left:3px;right:3px;height:4px;border-radius:2px;background:#fff;margin-bottom:-2px}
.sm{width:32px;height:32px}
.bubble{position:fixed;z-index:9;pointer-events:none;background:var(--ui2);padding:5px 9px;border-radius:8px;font-size:12px;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .15s}
.bubble.on{opacity:1}
.ring{position:fixed;z-index:4;pointer-events:none;border-radius:50%;border:1px solid rgba(255,255,255,.9);mix-blend-mode:difference;display:none;transform:translate(-50%,-50%)}
.pick{position:fixed;z-index:6;pointer-events:none;width:64px;height:64px;border-radius:50%;border:6px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 4px 18px rgba(0,0,0,.3);display:none;transform:translate(-50%,-110%)}
.pop{top:calc(62px + var(--st));right:calc(10px + var(--sr));width:min(372px,calc(100vw - 20px));max-height:calc(100vh - 76px - var(--st));
  overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:none;padding:6px 0 10px;background:var(--ui2)}
.pop.on{display:block}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 6px;font-weight:600;font-size:14px}
.ph .t{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.link{color:var(--mut);font-weight:500;font-size:13px;padding:6px 2px}
.link:active{color:#fff}
.grp{padding:12px 14px 4px;color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.bi{margin:2px 8px;padding:7px 8px 4px;border-radius:10px;display:block}
.bi.sel{background:var(--hi)}
.bi .bn{display:flex;justify-content:space-between;font-size:13px;opacity:.9}
.bi .tn{color:var(--mut);font-size:12px;display:none}
.bi.sel .tn{display:inline}
.bi canvas{display:block;width:100%;height:44px}
.pv{display:block;width:calc(100% - 24px);height:104px;margin:4px 12px 8px;border-radius:10px;background:#141415;touch-action:none}
.tabs{display:flex;gap:2px;margin:0 10px 6px;padding:3px;background:rgba(255,255,255,.06);border-radius:9px}
.tabs button{flex:1;padding:6px 0;border-radius:7px;font-size:12px;color:var(--mut)}
.tabs button.on{background:var(--hi);color:#fff}
.row{padding:7px 14px 8px;touch-action:pan-y}
.row .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.row .v{color:var(--mut);font-variant-numeric:tabular-nums}
.row .tr{height:4px;border-radius:2px;background:rgba(255,255,255,.1);position:relative}
.row .tf{position:absolute;top:0;bottom:0;background:#fff;border-radius:2px}
.row .tz{position:absolute;top:-3px;width:1px;height:10px;background:rgba(255,255,255,.25);left:50%}
.tg{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font-size:13px}
.sw{width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.14);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(16px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 8px}
.chip{padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.07);font-size:12px;color:var(--mut)}
.chip.on{background:#fff;color:#111}
.cv{display:block;width:calc(100% - 28px);height:150px;margin:4px 14px 6px;border-radius:8px;background:#141415;touch-action:none}
.hint{color:var(--mut);font-size:11.5px;padding:2px 14px 8px;line-height:1.45}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 16px;font-size:14px;text-align:left}
.mi:active{background:var(--hi)}
.mi .s{color:var(--mut);font-size:12px}
.mi.dz{color:#ff6961}
.sep{height:1px;background:var(--line);margin:6px 0}
.stat{padding:8px 16px 2px;color:var(--mut);font-size:11.5px;line-height:1.5;font-variant-numeric:tabular-nums}
#sv{display:block;width:calc(100% - 28px);height:190px;margin:8px 14px;border-radius:10px;touch-action:none}
#hue{display:block;width:calc(100% - 28px);height:24px;margin:4px 14px 10px;border-radius:12px;touch-action:none}
.sws{display:flex;flex-wrap:wrap;gap:8px;padding:2px 14px 8px}
.sws i{width:26px;height:26px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
.hexr{display:flex;align-items:center;gap:8px;padding:4px 14px}
.hexr input{flex:1;background:rgba(255,255,255,.07);border:0;border-radius:8px;color:#fff;font:13px ui-monospace,Menlo,monospace;padding:8px 10px;-webkit-user-select:text;user-select:text;outline:none}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ui2);padding:9px 14px;border-radius:10px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;font-size:13px}
.toast.on{opacity:1}
.xbar{left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;gap:2px;padding:4px;max-width:calc(100vw - 16px);overflow-x:auto}
.xbar.on{display:flex}
@media (max-width:430px){.xbar button{padding:8px 7px;font-size:12px}}
.xbar button{padding:9px 10px;border-radius:9px;font-size:12.5px;white-space:nowrap;color:var(--fg)}
.xbar button:active{background:var(--hi)}
.xbar .pri{background:#fff;color:#111;font-weight:600}
.ly{display:flex;align-items:center;gap:8px;margin:2px 8px;padding:6px 8px;border-radius:10px}
.ly.on{background:var(--hi)}
.ly .eye{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--fg);opacity:.85}
.ly .eye.off{opacity:.3}
.ly .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;color:#fff;font-family:inherit;padding:4px 2px;outline:none;-webkit-user-select:text;user-select:text}
.ly .ct{color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums}
.lyx{margin:0 8px 6px;padding:2px 0 6px;border-radius:0 0 10px 10px}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:2px 14px 4px}
.acts button{padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.07);font-size:12px;color:var(--fg)}
.acts button:disabled{opacity:.3}
.acts button.dz{color:#ff6961}
.sect{padding:12px 14px 2px;color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:#ddd;z-index:30;background:#2a2a2c}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ov"></canvas>
<div class="ring" id="ring"></div>
<div class="pick" id="pick"></div>

<div class="panel top" id="top">
  <button class="btn" id="menuBtn" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
  <button class="btn" id="selBtn" aria-label="Select"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5c4.7 0 8.5 2.3 8.5 5.2s-3.8 5.2-8.5 5.2S3.5 12.6 3.5 9.7 7.3 4.5 12 4.5z" stroke-dasharray="2.6 2.4"/><path d="M6.6 13.6c-1.4 1.6-1 3.9.8 4.5 1.5.5 2.9-.6 2.5-2"/></svg></button>
  <button class="btn on" id="brushBtn" aria-label="Brush"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5L10 19a3.5 3.5 0 0 1-5-5z"/><path d="M5 14c-1.6 1.6-1.6 4-3 5.5 2.6.4 5.4-.2 8-2.5"/></svg></button>
  <button class="btn" id="eraseBtn" aria-label="Eraser"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h12"/><path d="M4.6 14.6l9-9a2 2 0 0 1 2.8 0l2.9 2.9a2 2 0 0 1 0 2.8L12 18.6 8.6 20 4.6 16a1 1 0 0 1 0-1.4z"/><path d="M9.5 9.7l5.6 5.6"/></svg></button>
  <button class="btn" id="layBtn" aria-label="Layers"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M12 4l8.5 4.3L12 12.6 3.5 8.3z"/><path d="M3.5 12.2L12 16.5l8.5-4.3"/><path d="M3.5 16L12 20.3l8.5-4.3"/></svg></button>
  <button class="btn" id="colBtn" aria-label="Colour"><span class="dot" id="colDot"></span></button>
</div>

<div class="panel side" id="side">
  <div class="vs" id="sizeS"><div class="f"></div><div class="k"></div></div>
  <div class="vs" id="opS"><div class="f"></div><div class="k"></div></div>
  <button class="btn sm" id="undoBtn" aria-label="Undo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="btn sm" id="redoBtn" aria-label="Redo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
</div>
<div class="bubble" id="bub"></div>
<div class="panel pop" id="pop"></div>
<div class="panel xbar" id="xbar">
  <button id="xFlipH">Flip H</button><button id="xFlipV">Flip V</button><button id="xDup">Copy</button><button id="xDel">Delete</button><button id="xCancel">Cancel</button><button id="xDone" class="pri">Done</button>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" multiple style="display:none">
<input type="file" id="imgFile" accept="image/*" style="display:none">

<script>
'use strict';
/* =====================================================================
   Stroke Canvas — Procreate-style brush engine whose real job is
   capturing clean stroke data (x, y, pressure, altitude, azimuth, t).
   ===================================================================== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2, HALF_PI = Math.PI / 2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function curveEval(pts, x) {
  if (!pts || pts.length < 2) return x;
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) {
    const a = pts[i - 1], b = pts[i]; return a[1] + (b[1] - a[1]) * (b[0] === a[0] ? 1 : (x - a[0]) / (b[0] - a[0]));
  }
  return pts[pts.length - 1][1];
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

/* ---------------------------------------------------------------- params */
const DEF = {
  size: 1, opacity: 1, // size in millimetres
  spacing: .05, streamline: .2, stabilize: 0, motionFilter: 0, jitter: 0, flow: 1, buildup: 0,
  tip: 'orig', grain: 'orig',
  angle: 0, rotation: 0, azimuth: 0, scatter: 0, randomize: 0, roundness: 1, tiltRound: 0, tipInvert: 0,
  grainDepth: 0, grainScale: .5, grainMove: 0, grainInvert: 0,
  taperStart: 0, taperEnd: 0, taperSize: .8, taperOpacity: 0,
  pSize: .6, pOpacity: 0, minSize: 0, pCurve: [[0, 0], [1, 1]],
  tSize: 0, tOpacity: 0, sSize: 0, sOpacity: 0, jSize: 0, jOpacity: 0
};
const STROKE_KEYS = Object.keys(DEF).filter(k => k !== 'size' && k !== 'opacity');

/* ------------------------------------------------- procedural textures */
const texCache = new Map();
function makeCanvas(n) { const c = document.createElement('canvas'); c.width = c.height = n; return c; }
function fromField(n, f) {
  const c = makeCanvas(n), x = c.getContext('2d'), im = x.createImageData(n, n), d = im.data;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const v = clamp(f(i, j), 0, 1) * 255, o = (j * n + i) * 4; d[o] = d[o + 1] = d[o + 2] = v; d[o + 3] = 255; }
  x.putImageData(im, 0, 0); return c;
}
function periodicNoise(seed, period) { // tileable value noise
  const r = mulberry32(seed), g = new Float32Array(period * period); for (let i = 0; i < g.length; i++) g[i] = r();
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
    const P = period, a = g[((yi % P + P) % P) * P + ((xi % P + P) % P)], b = g[((yi % P + P) % P) * P + (((xi + 1) % P + P) % P)],
      c = g[(((yi + 1) % P + P) % P) * P + ((xi % P + P) % P)], d = g[(((yi + 1) % P + P) % P) * P + (((xi + 1) % P + P) % P)];
    return lerp(lerp(a, b, sx), lerp(c, d, sx), sy); };
}
function fbm(n, seed, base, oct, gain) {
  const ns = []; for (let o = 0; o < oct; o++) ns.push(periodicNoise(seed + o * 97, base << o));
  return (i, j) => { let v = 0, a = 1, s = 0; for (let o = 0; o < oct; o++) { const P = base << o; v += ns[o](i / n * P, j / n * P) * a; s += a; a *= gain; } return v / s; };
}
const PROC_TIPS = {
  hard: n => fromField(n, (i, j) => { const r = Math.hypot(i + .5 - n / 2, j + .5 - n / 2), R = n / 2 - 4; return clamp(R - r + .5, 0, 1); }),
  medium: n => fromField(n, (i, j) => { const r = Math.hypot(i + .5 - n / 2, j + .5 - n / 2) / (n / 2 - 4); return 1 - clamp((r - .72) / .28, 0, 1) ** 1.4; }),
  soft: n => fromField(n, (i, j) => { const r = Math.hypot(i + .5 - n / 2, j + .5 - n / 2) / (n / 2 - 2); return r >= 1 ? 0 : Math.exp(-r * r * 4.2) * (1 - r * r); }),
  oval: n => fromField(n, (i, j) => { const x = (i + .5 - n / 2) / (n / 2 - 4), y = (j + .5 - n / 2) / ((n / 2 - 4) * .55); return clamp((1 - Math.hypot(x, y)) * n / 3, 0, 1); }),
  slim: n => fromField(n, (i, j) => { const x = (i + .5 - n / 2) / (n / 2 - 4), y = (j + .5 - n / 2) / ((n / 2 - 4) * .28); return clamp((1 - Math.hypot(x, y)) * n / 5, 0, 1); }),
  pencil: n => { const f = fbm(n, 11, 8, 4, .6), r2 = mulberry32(5); return fromField(n, (i, j) => { const r = Math.hypot(i + .5 - n / 2, j + .5 - n / 2) / (n / 2 - 4); if (r >= 1) return 0; return clamp((1 - r) * 3, 0, 1) * clamp(f(i, j) * 1.7 - .25 + (r2() - .5) * .35, 0, 1); }); },
  bristle: n => { const f = fbm(n, 21, 4, 5, .55), g = periodicNoise(33, 64); return fromField(n, (i, j) => { const x = (i + .5 - n / 2) / (n / 2 - 4), y = (j + .5 - n / 2) / (n / 2 - 4), r = Math.hypot(x, y); if (r >= 1) return 0; const streak = g(i / n * 64, j / n * 2.5); return clamp((1 - r) * 2.2, 0, 1) * clamp(f(i, j) * 1.4 + streak * .6 - .45, 0, 1); }); },
  square: n => fromField(n, (i, j) => (i > 6 && j > 6 && i < n - 7 && j < n - 7) ? 1 : 0)
};
const PROC_GRAINS = {
  paper: n => { const f = fbm(n, 7, 16, 5, .55), r = mulberry32(3); return fromField(n, (i, j) => clamp((f(i, j) - .5) * 2.4 + .55 + (r() - .5) * .35, 0, 1)); },
  canvas: n => { const f = fbm(n, 9, 32, 3, .5); return fromField(n, (i, j) => { const w = Math.abs(Math.sin(i / n * TAU * 40)) * .5 + Math.abs(Math.sin(j / n * TAU * 40)) * .5; return clamp(.35 + w * .45 + (f(i, j) - .5) * .9, 0, 1); }); },
  wood: n => { const f = fbm(n, 13, 4, 4, .5), g = periodicNoise(17, 128); return fromField(n, (i, j) => { const v = Math.sin((j / n * 24 + f(i, j) * 3) * TAU) * .5 + .5; return clamp(.25 + v * .6 + (g(i / n * 4, j / n * 128) - .5) * .5, 0, 1); }); },
  noise: n => { const r = mulberry32(42); return fromField(n, () => r() * r() * 1.6); },
  charcoal: n => { const f = fbm(n, 5, 8, 6, .62), g = periodicNoise(51, 256); return fromField(n, (i, j) => clamp((f(i, j) - .45) * 3 + (g(i / n * 256, j / n * 256) - .5) * .9 + .2, 0, 1)); }
};
function procTip(id) { const k = 'tip:' + id; if (!texCache.has(k)) texCache.set(k, (PROC_TIPS[id] || PROC_TIPS.medium)(256)); return texCache.get(k); }
function procGrain(id) { const k = 'grain:' + id; if (!texCache.has(k)) texCache.set(k, (PROC_GRAINS[id] || PROC_GRAINS.paper)(512)); return texCache.get(k); }
function guessTip(name) {
  const s = (name || '').toLowerCase();
  if (s.includes('slim')) return 'slim'; if (s.includes('oval')) return 'oval';
  if (/soft|air|blur|glow/.test(s)) return 'soft'; if (s.includes('medium')) return 'medium';
  if (/stamp|acrylic|bristle|oil|gouache|brush-art|charcoal|chalk/.test(s)) return 'bristle';
  if (/pencil|graphite|sketch/.test(s)) return 'pencil';
  if (/hard|point|round|preset/.test(s)) return 'hard';
  return 'medium';
}
function guessGrain(name) {
  if (!name) return null; const s = name.toLowerCase();
  if (s.includes('blank')) return null; if (s.includes('canvas')) return 'canvas'; if (s.includes('wood')) return 'wood';
  if (/charcoal|chalk|pastel/.test(s)) return 'charcoal'; if (/noise|spray|spatter/.test(s)) return 'noise';

const fmtMm = v => (v < 1 ? v.toFixed(2) : v < 10 ? v.toFixed(1) : Math.round(v)) + ' mm';

async function deliver(blob, name) {

      for (const fb of found) {
        const id = 'imp:' + slug(fb.name) + '-' + hashStr(fb.name + JSON.stringify(fb.P)).slice(0, 5);
        addBrush({ id, name: fb.name, group: 'Imported', origTip: fb.tip, origGrain: fb.grain, base: fb.P, p: JSON.parse(JSON.stringify(fb.P)) });
        for (const k of [...gpuTex.keys()]) if (k.startsWith('b:' + id + ':')) { gl.deleteTexture(gpuTex.get(k)); gpuTex.delete(k); }

}
